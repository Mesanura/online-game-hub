name: ${COMPOSE_PROJECT_NAME:-online-game-hub}

services:
  postgres:
    image: postgres:17.6-alpine3.22
    command: ["postgres", "-p", "${POSTGRES_INTERNAL_PORT:-5432}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-online_game_hub}
      POSTGRES_USER: ${POSTGRES_USER:-online_game_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT:-5432}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:${POSTGRES_INTERNAL_PORT:-5432}"
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:-./data/postgres}
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p $${POSTGRES_INTERNAL_PORT} -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - app

  migrate:
    image: ${DOCKER_IMAGE_NAMESPACE:-mesanura}/online-game-hub-database-migrator:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-online_game_hub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:${POSTGRES_INTERNAL_PORT:-5432}/${POSTGRES_DB:-online_game_hub}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "on-failure:5"
    networks:
      - app

  game-server:
    image: ${DOCKER_IMAGE_NAMESPACE:-mesanura}/online-game-hub-game-server:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    init: true
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-development}
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-online_game_hub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:${POSTGRES_INTERNAL_PORT:-5432}/${POSTGRES_DB:-online_game_hub}
      GAME_SERVER_HOST: 0.0.0.0
      GAME_SERVER_PORT: ${GAME_SERVER_INTERNAL_PORT:-2567}
      GAME_SERVER_ALLOWED_WEB_ORIGINS: ${WEB_PUBLIC_ORIGIN:-http://localhost:3000}
      GAME_SERVER_RECONNECT_GRACE_MILLISECONDS: ${GAME_SERVER_RECONNECT_GRACE_MILLISECONDS:-60000}
      GAME_SERVER_TICKET_ISSUER: ${GAME_SERVER_TICKET_ISSUER:-online-game-hub-web}
      GAME_SERVER_TICKET_SECRET: ${GAME_SERVER_TICKET_SECRET:?Set GAME_SERVER_TICKET_SECRET in .env}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${GAME_SERVER_PORT:-2567}:${GAME_SERVER_INTERNAL_PORT:-2567}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + process.env.GAME_SERVER_PORT + '/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app

  web:
    image: ${DOCKER_IMAGE_NAMESPACE:-mesanura}/online-game-hub-web:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    init: true
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-development}
      HOSTNAME: 0.0.0.0
      PORT: ${WEB_INTERNAL_PORT:-3000}
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-online_game_hub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:${POSTGRES_INTERNAL_PORT:-5432}/${POSTGRES_DB:-online_game_hub}
      GAME_SERVER_PUBLIC_URL: ${GAME_SERVER_PUBLIC_URL:-http://localhost:2567}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:?Set GUEST_SESSION_SECRET in .env}
      GUEST_COOKIE_SECURE: ${GUEST_COOKIE_SECURE:-false}
      GAME_SERVER_TICKET_ISSUER: ${GAME_SERVER_TICKET_ISSUER:-online-game-hub-web}
      GAME_SERVER_TICKET_SECRET: ${GAME_SERVER_TICKET_SECRET:?Set GAME_SERVER_TICKET_SECRET in .env}
      GAME_SERVER_TICKET_LIFETIME_SECONDS: ${GAME_SERVER_TICKET_LIFETIME_SECONDS:-30}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:${WEB_INTERNAL_PORT:-3000}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + process.env.PORT + '/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      game-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
